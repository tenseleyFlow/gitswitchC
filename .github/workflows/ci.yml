name: CI

on:
  push:
    branches:
      - trunk
  pull_request:

# Every job is read-only. Individual jobs may narrow this further, but no
# build or audit lane needs to mutate repository contents.
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Keep the checker adjacent to the canonical checkout. No preceding run
      # step may replace this repository-owned script before it validates the
      # remainder of the workflow.
      - name: CI policy self-check
        run: /bin/sh tests/test_ci_policy.sh .
      - name: Install native test runtimes and QA dependencies
        # rpm: gives distcheck a real rpmbuild so the archive-satisfies-its-
        # own-spec lane (AR-05 L17) actually runs instead of skipping.
        # dash also provides the Ubuntu /bin/sh implementation;
        # openssh-client provides ssh, ssh-agent, ssh-add, and ssh-keygen.
        run: |
          # AR-10 L31: Ubuntu 24.04 restricts unprivileged user namespaces
          # via AppArmor. The mount-namespace security regressions run
          # unprivileged through a user-namespace fallback and are REQUIRED
          # capabilities on this job's test steps, so permit userns here.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y \
            bash binutils dash fish gnupg ksh libreadline-dev openssh-client zsh \
            cppcheck curl flawfinder rpm shellcheck valgrind
      # Every Linux make invocation below uses the package-owned absolute path.
      # Verify its recorded package checksum before any build command executes,
      # so a resolver or filesystem replacement cannot turn literal gates into
      # no-op command text.
      - name: Verify GNU Make package provenance
        run: /usr/bin/dpkg --verify make
      - name: Behavioral coverage policy
        run: COVERAGE_POLICY_MAKE=/usr/bin/make /bin/sh tests/test_coverage.sh --static Makefile
      # Ubuntu 24.04's gcovr 7.0 cannot consume GCC 13 block records. Use the
      # upstream 8.6 standalone binary, bound to its reviewed release digest,
      # from a private runner-temporary directory. Only its verified absolute
      # path crosses the step boundary.
      - name: Install pinned gcovr coverage reporter
        id: gcovr
        run: |
          set -eu
          umask 077
          test "$(/usr/bin/uname -m)" = x86_64
          gcovr_url='https://github.com/gcovr/gcovr/releases/download/8.6/gcovr-8.6-linux-x86_64'
          gcovr_sha256='dbeacffd6d1ed7bac9ef706c7405a80415c03ce37471fb77ec9db1937d780bc8'
          gcovr_dir=$(/usr/bin/mktemp -d "$RUNNER_TEMP/gcovr.XXXXXX")
          test "$(/usr/bin/stat -c '%u:%a:%F' "$gcovr_dir")" = "$(/usr/bin/id -u):700:directory"
          gcovr_download="$gcovr_dir/gcovr-8.6-linux-x86_64.download"
          gcovr_path="$gcovr_dir/gcovr-8.6-linux-x86_64"
          /usr/bin/curl --fail --show-error --silent --location --retry 5 --retry-all-errors --proto '=https' --proto-redir '=https' --tlsv1.2 "$gcovr_url" --output "$gcovr_download"
          printf '%s  %s\n' "$gcovr_sha256" "$gcovr_download" | /usr/bin/sha256sum --check --strict -
          /usr/bin/install -m 0555 "$gcovr_download" "$gcovr_path"
          test "$(/usr/bin/stat -c '%u:%a:%F' "$gcovr_path")" = "$(/usr/bin/id -u):555:regular file"
          printf '%s  %s\n' "$gcovr_sha256" "$gcovr_path" | /usr/bin/sha256sum --check --strict -
          /usr/bin/rm -- "$gcovr_download"
          test "$("$gcovr_path" --version | /usr/bin/sed -n '1p')" = 'gcovr 8.6'
          printf 'path=%s\n' "$gcovr_path" >> "$GITHUB_OUTPUT"
      - name: Shell assets (ShellCheck + native parsers)
        run: /usr/bin/make shell-static-test
      # Fast textual tripwire only — headers included, but whitespace variants,
      # function-pointer indirection, and macro wrapping evade a grep. The
      # authoritative gate is the symbol check on the built binary below
      # (AR-05 L8).
      - name: No-shell gate (source tripwire)
        # AR-10 L27: tools/ (the release publisher) is inside the release
        # pipeline's trust boundary and is held to the same no-shell rule.
        run: |
          if grep -rn -e 'popen(' -e 'system(' src/*.c src/*.h tools/*.c; then
            echo "ERROR: shell-based process execution reintroduced in src/ or tools/" >&2
            exit 1
          fi
      - name: Build + test (ASan/UBSan, warnings-as-errors, runtimes required)
        # AR-08 M45/M46: this is the designated native-runtime lane. Every
        # provisioned capability is mandatory here, so a vanished runtime or
        # disabled readline build fails instead of becoming a green skip.
        run: /usr/bin/make BUILD_TYPE=debug READLINE=1 WERROR=1 test
        env:
          GITSWITCH_TEST_REQUIRED_CAPS: pty,readline,bash,zsh,fish,sh,dash,ksh,openssh,gpg,unix-sockets,mount-namespace
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Source coverage (GCC/gcovr, measured line + branch ratchet)
        run: /usr/bin/make coverage
        env:
          GITSWITCH_TEST_REQUIRED_CAPS: pty,readline,bash,zsh,fish,sh,dash,ksh,openssh,gpg,unix-sockets,mount-namespace
          GCOVR: ${{ steps.gcovr.outputs.path }}
      - name: Verify coverage build provenance
        run: test "$(/usr/bin/sed -n '1s/|.*//p' build/obj/.buildconfig)" = coverage && test -s build/coverage/coverage.json
      - name: Upload source coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-gcc-coverage
          path: build/coverage/
          if-no-files-found: error
      - name: Clean before the GCC release build
        run: /usr/bin/make clean
      - name: Release build + full NDEBUG suite (FORTIFY/RELRO, warnings-as-errors)
        run: /usr/bin/make BUILD_TYPE=release READLINE=1 WERROR=1 test
        env:
          GITSWITCH_TEST_REQUIRED_CAPS: pty,readline,bash,zsh,fish,sh,dash,ksh,openssh,gpg,unix-sockets,mount-namespace
      - name: Release artifact hardening (built + staged)
        run: /usr/bin/make BUILD_TYPE=release READLINE=1 WERROR=1 release-artifact-test
      # AR-05 L8 / AR-11 M38: force a publisher rebuild and inspect its symbols
      # inside one cross-process lock, so concurrent clean/rebuild operations
      # cannot replace the helper between provenance validation and use.
      - name: No-shell gate (locked publisher build + binary symbols)
        run: /usr/bin/make -B release-symbol-contract-test
      # AR-05 L3: run REAL Valgrind against the release binaries. The
      # qa-contract-test below only proves the recipe's failure plumbing via
      # a shim; without this step no actual memory checking ever executed in
      # the pipeline.
      # AR-10 L36: WERROR=1 matches the release gates above, so the
      # build-config stamp is identical and Valgrind checks the exact objects
      # those gates validated instead of forcing a divergent rebuild.
      - name: Memory check (Valgrind, release)
        run: /usr/bin/make BUILD_TYPE=release READLINE=1 WERROR=1 memcheck
      - name: Source distribution self-check
        run: /usr/bin/make distcheck
      - name: Release input consistency and dirty-tree refusal
        run: /usr/bin/make release-contract-test
      - name: Static analysis (cppcheck)
        run: /usr/bin/make analyze
      - name: Security scan (flawfinder)
        run: /usr/bin/make security-scan
      - name: QA negative-path contracts
        run: /usr/bin/make qa-contract-test
      # AR-06 F32: the SIG-01/SIG-02/F4 end-to-end signal-interruption repro
      # drives the REAL binary with a real ssh-agent and a git shim that races
      # the identity write. It was tracked but executed by nothing; run it here
      # (Linux, which ships ssh-agent) so a regression in the mid-switch signal
      # window is caught in CI.
      # AR-10 L36: same flag set as the release gates for stamp identity.
      - name: Signal-interruption repro (SIG-01/SIG-02/F4)
        run: /usr/bin/make BUILD_TYPE=release READLINE=1 WERROR=1 sig-repro-test
        env:
          GITSWITCH_TEST_REQUIRED_CAPS: openssh
      - name: Clean before the clang release build
        run: /usr/bin/make clean
      - name: Linux clang release build + full NDEBUG suite
        run: /usr/bin/make CC=clang BUILD_TYPE=release READLINE=1 WERROR=1 test
        env:
          GITSWITCH_TEST_REQUIRED_CAPS: pty,readline,bash,zsh,fish,sh,dash,ksh,openssh,gpg,unix-sockets,mount-namespace
      - name: Linux clang release artifact hardening
        run: /usr/bin/make CC=clang BUILD_TYPE=release READLINE=1 WERROR=1 release-artifact-test

  freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Start FreeBSD 14.4 VM
        uses: cross-platform-actions/action@5ea7e8e4677bd726033a10b094ba1c5762b15dee # v1.3.0
        with:
          operating_system: freebsd
          version: '14.4'
          # pkg's catalogue processing now OOMs at the action's default VM
          # memory (deterministic exit-137 during provisioning); the host
          # runner has 16G, so give the VM enough headroom.
          memory: 8G
      - name: Build + test on FreeBSD
        # Tests run in release mode here: FreeBSD enables ASLR, which is
        # incompatible with ASan/PIE binaries (they abort on init). The
        # Linux/macOS jobs provide the ASan/UBSan coverage.
        run: |
          # Keep every standalone release gate fatal within this shared VM
          # script; the policy checker verifies this precedes all three.
          set -eu
          # git: the git_ops perf tests prove availability via a PATH walk
          # and assert no subprocess spawn — they need a real git binary,
          # which the Linux/macOS runners ship but this VM does not.
          # AR-10 L35: the shells, gnupg, and readline used to be absent, so
          # every gpg/shell-integration suite green-skipped on the sole
          # FreeBSD gate. Provision them and require the capabilities below
          # (inline export: step-level env maps are forbidden on this job).
          # ksh stays best-effort: FreeBSD's ksh93 packaging does not reliably
          # install a binary literally named `ksh`, which is what the suites
          # resolve.
          # The quarterly branch's CDN currently 404s hashed package objects
          # its own metadata references (probed directly: HTTP 404 on the
          # exact URL pkg fetches; pkg reports it as a misleading write
          # error). Pin this VM to the 'latest' branch until upstream heals.
          sudo mkdir -p /usr/local/etc/pkg/repos
          printf 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }\n' \
            | sudo tee /usr/local/etc/pkg/repos/FreeBSD.conf
          sudo pkg update -f
          sudo pkg install -y gmake gcc git binutils \
            bash dash fish gnupg readline zsh
          # FreeBSD needs fdescfs for descriptor-pinned interpreted helpers:
          # run_argv passes the verified script as /dev/fd/4 and never falls
          # back to its mutable pathname. The minimal CI image does not mount
          # fdescfs, although normal installations commonly do.
          if ! mount | grep -q ' on /dev/fd '; then
            sudo mount -t fdescfs none /dev/fd
          fi
          exec 9</bin/sh
          cmp -s /bin/sh /dev/fd/9
          exec 9<&-
          readelf_tool=$(command -v readelf || command -v llvm-readelf || command -v greadelf)
          test -n "$readelf_tool"
          "$readelf_tool" -h /bin/sh >/dev/null
          export READELF="$readelf_tool"
          gmake BUILD_TYPE=release WERROR=1
          # AR-10 L35: provisioned runtimes are mandatory, matching the
          # Linux/macOS lanes (minus ksh per above). nullfs lineage is a
          # FreeBSD-only security contract and may not green-skip here.
          export GITSWITCH_TEST_REQUIRED_CAPS=pty,readline,bash,zsh,fish,sh,dash,openssh,gpg,unix-sockets,freebsd-nullfs
          gmake BUILD_TYPE=release WERROR=1 test
          gmake BUILD_TYPE=release WERROR=1 release-artifact-test
          # Compiles and exercises FreeBSD's descriptor-conditioned
          # funlinkat staging retirement instead of merely parsing it.
          gmake release-contract-test
        shell: cpa.sh {0}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install required test runtimes
        # macOS supplies bash/zsh/sh and OpenSSH. These packages make the
        # remaining declared capabilities explicit instead of green-skipping
        # them in either build configuration.
        run: brew install dash fish gnupg ksh93 readline
      - name: AR-14 exact-generation diagnostic preflight
        run: |
          /usr/bin/make BUILD_TYPE=debug READLINE=1 WERROR=1 build/bin/test_ar08_git_transaction
          attempt=1
          while [ "$attempt" -le 20 ]; do
            echo "exact-generation stress attempt $attempt/20"
            GITSWITCH_AR08_CONFLICT_RETRY_ONLY=1 ./build/bin/test_ar08_git_transaction
            attempt=$((attempt + 1))
          done
      - name: Build + test (ASan/UBSan, warnings-as-errors)
        run: /usr/bin/make BUILD_TYPE=debug READLINE=1 WERROR=1 test
        env:
          # Linux-only pidfd/mount-namespace seams are inapplicable on Darwin.
          # AR-10 L31: the Linux lanes list mount-namespace as a REQUIRED
          # capability (with a userns fallback), so "covered by Linux" is now
          # enforced rather than assumed; every portable runtime is mandatory.
          GITSWITCH_TEST_REQUIRED_CAPS: pty,readline,bash,zsh,fish,sh,dash,ksh,openssh,gpg,unix-sockets
      - name: Clean before the release build
        run: /usr/bin/make clean
      - name: Release build + full NDEBUG suite (warnings-as-errors)
        run: /usr/bin/make BUILD_TYPE=release READLINE=1 WERROR=1 test
        env:
          # Same sole OS-specific exclusion as the debug lane above.
          GITSWITCH_TEST_REQUIRED_CAPS: pty,readline,bash,zsh,fish,sh,dash,ksh,openssh,gpg,unix-sockets
      - name: Release artifact hardening (built + staged)
        run: /usr/bin/make BUILD_TYPE=release READLINE=1 WERROR=1 release-artifact-test
      # Exercises Darwin's descriptor-bound atomic clone publisher, including
      # adoption, retained-source, and cleanup-race behavior.
      - name: Release input consistency and dirty-tree refusal
        run: /usr/bin/make release-contract-test
