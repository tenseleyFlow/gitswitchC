name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # rpm: gives distcheck a real rpmbuild so the archive-satisfies-its-
        # own-spec lane (AR-05 L17) actually runs instead of skipping.
        run: sudo apt-get update && sudo apt-get install -y cppcheck flawfinder rpm
      # Fast textual tripwire only — headers included, but whitespace variants,
      # function-pointer indirection, and macro wrapping evade a grep. The
      # authoritative gate is the symbol check on the built binary below
      # (AR-05 L8).
      - name: No-shell gate (source tripwire)
        run: |
          if grep -rn -e 'popen(' -e 'system(' src/*.c src/*.h; then
            echo "ERROR: shell-based process execution reintroduced in src/" >&2
            exit 1
          fi
      - name: Build + test (ASan/UBSan, warnings-as-errors)
        run: make BUILD_TYPE=debug WERROR=1 test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Release build (FORTIFY/RELRO, warnings-as-errors)
        run: make clean && make BUILD_TYPE=release WERROR=1
      - name: Release artifact hardening (built + staged)
        run: make BUILD_TYPE=release release-artifact-test
      # AR-05 L8: symbol-level no-shell gate. An undefined-symbol reference to
      # system()/popen() in the linked binary catches ANY call path — headers,
      # whitespace variants, function pointers — that the textual tripwire
      # above cannot. This is the regression gate for the v1.7.0
      # shell-injection fix.
      - name: No-shell gate (binary symbols)
        run: |
          # AR-06 F34: fail loudly if the binary is missing or nm errors, so a
          # path/name change cannot silently disarm the gate (an empty pipe used
          # to grep-miss and pass vacuously).
          test -x build/bin/gitswitch || { echo "ERROR: release binary build/bin/gitswitch missing or not executable" >&2; exit 1; }
          syms=$(nm -D --undefined-only build/bin/gitswitch) || { echo "ERROR: nm failed on release binary" >&2; exit 1; }
          if printf '%s\n' "$syms" | grep -E '(^| )(system|popen)(@|$)'; then
            echo "ERROR: release binary references system()/popen()" >&2
            exit 1
          fi
      # AR-05 L3: run REAL Valgrind against the release binaries. The
      # qa-contract-test below only proves the recipe's failure plumbing via
      # a shim; without this step no actual memory checking ever executed in
      # the pipeline.
      - name: Memory check (Valgrind, release)
        run: sudo apt-get install -y valgrind && make BUILD_TYPE=release memcheck
      - name: Source distribution self-check
        run: make distcheck
      - name: Release input consistency and dirty-tree refusal
        run: make release-contract-test
      - name: Static analysis (cppcheck)
        run: make analyze
      - name: Security scan (flawfinder)
        run: make security-scan
      - name: QA negative-path contracts
        run: make qa-contract-test
      # AR-06 F32: the SIG-01/SIG-02/F4 end-to-end signal-interruption repro
      # drives the REAL binary with a real ssh-agent and a git shim that races
      # the identity write. It was tracked but executed by nothing; run it here
      # (Linux, which ships ssh-agent) so a regression in the mid-switch signal
      # window is caught in CI.
      - name: Signal-interruption repro (SIG-01/SIG-02/F4)
        run: make BUILD_TYPE=release sig-repro-test
      - name: Linux clang release build + hardening
        run: |
          make clean
          make CC=clang BUILD_TYPE=release WERROR=1
          make CC=clang BUILD_TYPE=release release-artifact-test

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test on FreeBSD
        uses: cross-platform-actions/action@v0.27.0
        with:
          operating_system: freebsd
          version: '14.2'
          shell: bash
          # Tests run in release mode here: FreeBSD enables ASLR, which is
          # incompatible with ASan/PIE binaries (they abort on init). The
          # Linux/macOS jobs provide the ASan/UBSan coverage.
          run: |
            # git: the git_ops perf tests prove availability via a PATH walk
            # and assert no subprocess spawn — they need a real git binary,
            # which the Linux/macOS runners ship but this VM does not.
            sudo pkg install -y gmake gcc git binutils
            readelf_tool=$(command -v readelf || command -v llvm-readelf || command -v greadelf)
            test -n "$readelf_tool"
            "$readelf_tool" -h /bin/sh >/dev/null
            export READELF="$readelf_tool"
            gmake BUILD_TYPE=release WERROR=1
            gmake BUILD_TYPE=release WERROR=1 test
            gmake BUILD_TYPE=release release-artifact-test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + test (ASan/UBSan, warnings-as-errors)
        run: make BUILD_TYPE=debug WERROR=1 test
      - name: Release build (warnings-as-errors)
        run: |
          make clean
          make BUILD_TYPE=release WERROR=1
          make BUILD_TYPE=release release-artifact-test
